name: release
# Publish a GitHub release (Releases > Draft a new release > Publish) and this
# workflow builds Windows + macOS + Linux and attaches them to it.
# Run manually (Actions > release > Run workflow) to just get the builds as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build zookeeper.exe
        env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o zookeeper.exe ./cmd/zookeeper
      - uses: actions/upload-artifact@v4
        with: {name: zookeeper-windows, path: zookeeper.exe}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build Zoo Keeper.app (universal)
        run: |
          set -e
          APP="dist/Zoo Keeper.app"
          mkdir -p "$APP/Contents/MacOS"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o dist/zk-arm64 ./cmd/zookeeper
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o dist/zk-amd64 ./cmd/zookeeper
          lipo -create -output "$APP/Contents/MacOS/zookeeper" dist/zk-arm64 dist/zk-amd64
          cat > "$APP/Contents/Info.plist" <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>zookeeper</string>
          <key>CFBundleIdentifier</key><string>local.zookeeper</string>
          <key>CFBundleName</key><string>Zoo Keeper</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PL
          codesign --force --deep -s - "$APP"
          cd dist && zip -qry ../ZooKeeper-mac.zip "Zoo Keeper.app"
      - uses: actions/upload-artifact@v4
        with: {name: zookeeper-mac, path: ZooKeeper-mac.zip}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: Build zookeeper (linux/amd64, SteamOS compatible)
        env: {GOOS: linux, GOARCH: amd64, CGO_ENABLED: '1'}
        run: |
          go build -trimpath -ldflags "-s -w" -o zookeeper ./cmd/zookeeper
          tar -czf ZooKeeper-linux.tar.gz zookeeper
      - uses: actions/upload-artifact@v4
        with: {name: zookeeper-linux, path: ZooKeeper-linux.tar.gz}

  publish:
    if: github.event_name == 'release'
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/zookeeper.exe out/ZooKeeper-mac.zip out/ZooKeeper-linux.tar.gz --clobber --repo "${{ github.repository }}"
